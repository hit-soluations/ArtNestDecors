<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | ArtNest Decors</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            padding-top: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1A1A1A 0%, #2a1a1f 50%, #1A1A1A 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(247, 220, 180, 0.05) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(30px); }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            animation: slideUp 0.6s ease-out;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid rgba(247, 220, 180, 0.1);
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 
                0 20px 60px rgba(61, 18, 23, 0.3),
                inset 0 1px 0 rgba(247, 220, 180, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(247, 220, 180, 0.2), transparent);
        }

        /* Header Section */
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), #f0d99a);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(247, 220, 180, 0.15);
            font-size: 28px;
            color: var(--bg-card);
            animation: iconPulse 2.5s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(247, 220, 180, 0.15); }
            50% { box-shadow: 0 10px 40px rgba(247, 220, 180, 0.3); }
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Form Section */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(247, 220, 180, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(197, 178, 180, 0.5);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(247, 220, 180, 0.1);
            transform: translateY(-2px);
        }

        .form-group input:hover {
            border-color: rgba(247, 220, 180, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Input Icons */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding-left: 40px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--accent);
            font-size: 14px;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .form-group input:focus ~ .input-icon,
        .form-group input:not(:placeholder-shown) ~ .input-icon {
            opacity: 1;
            color: var(--accent);
        }

        /* Submit Button */
        .login-btn {
            background: linear-gradient(135deg, var(--accent), #f0d99a);
            color: var(--bg-card);
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(247, 220, 180, 0.2);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(247, 220, 180, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: 0 10px 30px rgba(247, 220, 180, 0.15);
        }

        /* Loading State */
        .login-btn.loading {
            pointer-events: none;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(61, 18, 23, 0.3);
            border-radius: 50%;
            border-top-color: var(--bg-card);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error Message */
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid rgba(247, 220, 180, 0.1);
            color: var(--text-muted);
            font-size: 12px;
        }

        .login-footer i {
            color: var(--accent);
            margin: 0 4px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 40px 28px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1>Admin Access</h1>
                <p>Secure Login Portal</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm" class="login-form" action="/login" method="POST">
                <div class="form-group">
                    <label for="authUsername">Username</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="authUsername" 
                            name="username" 
                            required 
                            placeholder="Enter your username"
                            autocomplete="username"
                        >
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="authPasskey">Passkey</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="authPasskey" 
                            name="passkey" 
                            required 
                            placeholder="Enter your passkey"
                            autocomplete="current-password"
                        >
                        <i class="fas fa-key input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                <i class="fas fa-shield-alt"></i> Encrypted Connection <i class="fas fa-shield-alt"></i>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMessage');
        const submitBtn = form.querySelector('button[type="submit"]');

        async function loginUser(username, passkey) {
            const payload = new URLSearchParams();
            payload.append('username', username);
            payload.append('passkey', passkey);

            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: payload,
                redirect: 'follow'
            });

            if (response.ok) {
                window.location.href = '/welcome';
                return;
            }

            const text = await response.text();
            throw new Error(text || 'Login failed. Please check your credentials.');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');
            errorMsg.textContent = '';

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '';

            const username = document.getElementById('authUsername').value.trim();
            const passkey = document.getElementById('authPasskey').value;

            try {
                await loginUser(username, passkey);
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.textContent = originalText;
                errorMsg.textContent = err.message || 'An error occurred. Please try again.';
                errorMsg.classList.add('show');
            }
        });
    </script>
</body>
</html>
