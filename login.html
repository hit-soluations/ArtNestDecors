<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Gate | ArtNest Access</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-card { max-width: 400px; margin: 120px auto; background: var(--bg-card); padding: 40px; border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 style="text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; text-align: center; color: var(--primary);">System Admin Login</h3>
        <form id="loginForm" action="/login" method="POST">
            <div class="premium-input-group">
                <label>Username</label>
                <input type="text" id="authUsername" name="username" required placeholder="Enter username">
            </div>
            <div class="premium-input-group">
                <label>Passkey</label>
                <input type="password" id="authPasskey" name="passkey" required placeholder="Enter passkey">
            </div>
            <button type="submit" class="cta-submit-btn" style="width: 100%; margin-top: 10px;">Login</button>
        </form>
    </div>

    <script src="js/auth.js"></script>

   
</body>
</html>
