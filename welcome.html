<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ArtNest Decors</title>
    <link rel="stylesheet" href="publiccss/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1A1A1A 0%, #2a1a1f 50%, #1A1A1A 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(247, 220, 180, 0.05) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(30px); }
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .dashboard-header {
            background: var(--bg-card);
            border: 1px solid rgba(247, 220, 180, 0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(61, 18, 23, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .dashboard-header h1 {
            font-size: 28px;
            color: var(--primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dashboard-header i {
            color: var(--accent);
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: rgba(247, 220, 180, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.3);
        }

        /* Tabs */
        .tabs-container {
            background: var(--bg-card);
            border: 1px solid rgba(247, 220, 180, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(61, 18, 23, 0.3);
            backdrop-filter: blur(10px);
        }

        .tabs-header {
            display: flex;
            gap: 0;
            padding: 0;
            border-bottom: 1px solid rgba(247, 220, 180, 0.1);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tab-btn:hover {
            color: var(--accent);
        }

        .tab-btn.active {
            color: var(--accent);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        /* Tab Content */
        .tabs-content {
            padding: 40px;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Add Item Form */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .form-group label {
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(247, 220, 180, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group input::placeholder,
        .form-group select::placeholder {
            color: rgba(197, 178, 180, 0.5);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(247, 220, 180, 0.1);
        }

        .form-group select option {
            background: var(--bg-card);
            color: var(--text-main);
        }

        /* Image Upload Preview */
        .upload-preview {
            position: relative;
            border: 2px dashed rgba(247, 220, 180, 0.3);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .upload-preview:hover {
            border-color: var(--accent);
            background: rgba(247, 220, 180, 0.05);
        }

        .upload-preview.has-image {
            border-color: var(--accent);
            padding: 20px;
        }

        .upload-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 6px;
        }

        .upload-icon {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .upload-text {
            color: var(--text-muted);
            font-size: 13px;
        }

        #imageInput {
            display: none;
        }

        /* Submit Button */
        .submit-btn {
            background: linear-gradient(135deg, var(--accent), #f0d99a);
            color: var(--bg-card);
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 10px 30px rgba(247, 220, 180, 0.2);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(247, 220, 180, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Alert Messages */
        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            animation: slideDown 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert.success {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #28a745;
        }

        .alert.error {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(247, 220, 180, 0.1);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .item-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(247, 220, 180, 0.1);
            transform: translateY(-4px);
        }

        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .item-actions {
            padding: 12px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .delete-btn {
            flex: 1;
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(220, 53, 69, 0.3);
            border-color: #dc3545;
        }

        .item-title {
            padding: 10px 12px 0;
            font-size: 13px;
            font-weight: 700;
            color: #f7e8d3;
            text-align: center;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
        }

        .loading-state i {
            color: var(--accent);
            font-size: 20px;
        }

        /* Alert - Warning Type */
        .alert.warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        /* Upload Section Styling */
        #itemsContainer {
            margin-bottom: 20px;
        }

        #itemsContainer:not(:empty) {
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(247, 220, 180, 0.1);
            margin-bottom: 40px;
        }

        /* Upload Section Styling */
        #addItemForm {
            background: rgba(247, 220, 180, 0.03);
            border: 1px solid rgba(247, 220, 180, 0.1);
            border-radius: 8px;
            padding: 30px;
        }

        #uploadAlert {
            margin-top: 20px;
        }

        /* Manage Images Layout: Two Column */
        .manage-images-layout .tab-pane {
            display: flex !important;
            gap: 30px;
            align-items: flex-start;
        }

        .upload-section {
            flex: 1;
            min-width: 0;
        }

        .images-sidebar {
            flex: 0 0 350px;
            background: rgba(247, 220, 180, 0.02);
            border: 1px solid rgba(247, 220, 180, 0.1);
            border-radius: 8px;
            padding: 24px;
            max-height: calc(100vh - 400px);
            overflow-y: auto;
            position: sticky;
            top: 20px;
        }

        .images-sidebar h3 {
            margin: 0 0 20px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .images-sidebar h3 i {
            font-size: 16px;
        }

        .images-sidebar .items-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 0;
        }

        .images-sidebar .item-card {
            display: grid;
            grid-template-rows: auto auto;
            gap: 8px;
            border-radius: 6px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(247, 220, 180, 0.12);
        }

        .images-sidebar .item-image {
            width: 100%;
            height: auto;
            object-fit: cover;
            aspect-ratio: 16 / 9;
            display: block;
        }

        .images-sidebar .item-actions {
            padding: 10px 12px 14px;
            gap: 0;
            display: flex;
            justify-content: center;
        }

        .images-sidebar .delete-btn {
            width: 100%;
            padding: 8px 10px;
            font-size: 12px;
        }

        .images-sidebar .empty-state {
            padding: 30px 10px;
        }

        .images-sidebar .loading-state {
            padding: 20px 10px;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .manage-images-layout .tab-pane {
                flex-direction: column;
            }

            .images-sidebar {
                flex: 1;
                width: 100%;
                position: static;
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                text-align: center;
            }

            .tabs-content {
                padding: 20px;
            }

            .images-sidebar {
                padding: 16px;
            }

            .images-sidebar .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .tab-btn {
                font-size: 12px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1>
                <i class="fas fa-th-large"></i>
                Admin Dashboard
            </h1>
            <div class="user-info">
                <span class="user-badge" id="userBadge">User</span>
                <button class="logout-btn" onclick="logoutSession()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-btn active" data-tab="add-item">
                    <i class="fas fa-images"></i> Manage Images
                </button>
            </div>

            <div class="tabs-content manage-images-layout">
                <!-- Manage Images Tab (upload form + side panel with existing images) -->
                <div id="add-item" class="tab-pane active">
                    <!-- Main Upload Section -->
                    <div class="upload-section">
                        <div id="uploadAlert"></div>

                        <form id="addItemForm">
                            <div class="form-group">
                                <label for="serviceSelect">Service</label>
                                <select id="serviceSelect" name="service" required>
                                    <option value="">Select a service...</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="imageTitle">Image Title</label>
                                <input id="imageTitle" name="title" type="text" maxlength="100" placeholder="Enter image title" required>
                            </div>

                            <div class="form-group">
                                <label for="imageInput">Upload Image</label>
                                <div class="upload-preview" id="uploadPreview" onclick="document.getElementById('imageInput').click();">
                                    <div class="upload-icon">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                    </div>
                                    <div class="upload-text">Click to upload or drag image here</div>
                                    <div style="font-size: 11px; color: rgba(197, 178, 180, 0.4); margin-top: 8px;">
                                        JPG, PNG, WebP, GIF • Max 10MB
                                    </div>
                                </div>
                                <input type="file" id="imageInput" name="image" accept="image/*" required>
                            </div>

                            <button type="submit" class="submit-btn" id="submitBtn" disabled>Upload Image</button>
                        </form>
                    </div>

                    <!-- Side Panel: Existing Images -->
                    <div class="images-sidebar">
                        <h3><i class="fas fa-image"></i> Existing Images</h3>
                        <div id="imagesAlert"></div>
                        <div id="itemsContainer" class="items-grid">
                            <div class="empty-state">
                                <i class="fas fa-info-circle"></i>
                                <p>Select a service to view existing images.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                
                // Deactivate all tabs
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
                
                // Activate selected tab
                btn.classList.add('active');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // Set user badge
        const username = localStorage.getItem('artnest_user') || 'Admin';
        document.getElementById('userBadge').textContent = username.toUpperCase();

        const FALLBACK_SERVICES = [
            { id: 'painting', name: 'Painting Services & Coatings' },
            { id: 'interior', name: 'Architectural Interior Designs' },
            { id: 'murals', name: 'Hand-Crafted Wall Art & Murals' },
            { id: 'signage', name: 'Thermoplastic & Epoxy Signs' },
            { id: 'commercial', name: 'Commercial Sign Boards' },
            { id: 'automation', name: 'Electrical Automation & Wiring' },
            { id: 'waterfeatures', name: 'Artificial Rocks Waterfalls' },
            { id: 'thematic', name: 'Thematic Event Properties' }
        ];

        let uploadReady = true;

        function populateServiceOptions(services) {
            const select = document.getElementById('serviceSelect');
            // clear existing dynamic options
            Array.from(select.querySelectorAll('option')).forEach(option => {
                if (option.value !== '') option.remove();
            });
            services.forEach(service => {
                const option = document.createElement('option');
                option.value = service.id;
                option.textContent = service.name;
                select.appendChild(option);
            });
        }


        // Fetch services and initialize the upload form
        async function initializePage() {
            try {
                const servicesRes = await fetch('/api/services', { credentials: 'include' });
                if (!servicesRes.ok) throw new Error('Failed to fetch services');
                const services = await servicesRes.json();
                populateServiceOptions(services);
            } catch (err) {
                populateServiceOptions(FALLBACK_SERVICES);
                showAlert('uploadAlert', 'Failed to load services from server. Using local fallback list.', 'warning');
                console.error('initializePage services error:', err);
            }
        }

        function updateUploadButtonState() {
            const submitBtn = document.getElementById('submitBtn');
            const serviceId = document.getElementById('serviceSelect').value;
            const title = document.getElementById('imageTitle')?.value.trim();
            const file = document.getElementById('imageInput').files[0];
            const shouldEnable = Boolean(serviceId && title && file);
            submitBtn.disabled = !shouldEnable;
        }

        // Image upload preview
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('uploadPreview');

            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.classList.add('has-image');
                    preview.innerHTML = `<img src="${event.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.classList.remove('has-image');
                preview.innerHTML = `
                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <div class="upload-text">Click to upload or drag image here</div>
                    <div style="font-size: 11px; color: rgba(197, 178, 180, 0.4); margin-top: 8px;">JPG, PNG, WebP, GIF • Max 5MB</div>
                `;
            }
            updateUploadButtonState();
        });

        document.getElementById('serviceSelect').addEventListener('change', function() {
            loadItemsForService(this.value);
            updateUploadButtonState();
        });
        document.getElementById('imageTitle').addEventListener('input', updateUploadButtonState);

        // Drag and drop
        const uploadPreview = document.getElementById('uploadPreview');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadPreview.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        uploadPreview.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            document.getElementById('imageInput').files = files;
            const event = new Event('change', { bubbles: true });
            document.getElementById('imageInput').dispatchEvent(event);
        });

        // Form submission
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const serviceId = document.getElementById('serviceSelect').value;

            if (!serviceId) {
                showAlert('uploadAlert', 'Please select a service before uploading.', 'error');
                submitBtn.disabled = false;
                return;
            }
            const title = document.getElementById('imageTitle').value.trim();
            const formData = new FormData();
            formData.append('image', document.getElementById('imageInput').files[0]);
            formData.append('service', serviceId);
            formData.append('title', title);

            submitBtn.disabled = true;

            try {

                const response = await fetch('/api/items/upload', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                let data;
                if (response.headers.get('content-type')?.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = { error: await response.text() };
                }

                if (response.ok) {
                    showAlert('uploadAlert', 'Image uploaded successfully!', 'success');
                    
                    // Optimistically add the uploaded image to the gallery immediately
                    const container = document.getElementById('itemsContainer');
                    const newImageHtml = `
                        <div class="item-card">
                            <img src="${data.imagePath}" alt="${title}" class="item-image">
                            <div class="item-title">${title || 'Untitled'}</div>
                            <div class="item-actions">
                                <button type="button" class="delete-btn" disabled style="opacity:0.5;">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    `;
                    if (container && !container.querySelector('.empty-state')) {
                        container.insertAdjacentHTML('afterbegin', newImageHtml);
                    }
                    
                    document.getElementById('addItemForm').reset();
                    document.getElementById('uploadPreview').classList.remove('has-image');
                    document.getElementById('uploadPreview').innerHTML = `
                        <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                        <div class="upload-text">Click to upload or drag image here</div>
                        <div style="font-size: 11px; color: rgba(197, 178, 180, 0.4); margin-top: 8px;">JPG, PNG, WebP, GIF • Max 5MB</div>
                    `;
                    updateUploadButtonState();
                    
                    // Reload the full list in the background to ensure consistency
                    setTimeout(() => {
                        const svc = document.getElementById('serviceSelect').value;
                        if (svc) loadItemsForService(svc);
                    }, 1500);
                } else {
                    showAlert('uploadAlert', data.error || 'Failed to upload image', 'error');
                }
            } catch (err) {
                showAlert('uploadAlert', 'Error uploading image', 'error');
            } finally {
                submitBtn.disabled = false;
                // refresh images for selected service after attempt
                const svc = document.getElementById('serviceSelect').value;
                if (svc) loadItemsForService(svc);
            }
        });

        // Load items for service
        async function loadItemsForService(serviceId) {
            if (!serviceId) {
                document.getElementById('imagesAlert').innerHTML = '';
                document.getElementById('itemsContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-info-circle"></i>
                        <p>Select a service to view existing images.</p>
                    </div>
                `;
                return;
            }

            try {
                const container = document.getElementById('itemsContainer');
                container.innerHTML = `<div class="loading-state"><i class="fas fa-spinner fa-pulse"></i> Loading images...</div>`;

                // Timeout after 15 seconds
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`/api/items/${serviceId}`, {
                    credentials: 'include',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const items = await response.json();

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No images yet</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = items.map(item => {
                        // Prefer explicit stored image_path first (this covers uploads that returned a delivery URL).
                        // If image_path is empty but image_id exists, construct a Cloudinary delivery URL using the configured cloud name.
                        let src = item.image_path;
                        if ((!src || src === '') && item.image_id && window.__IMG_CLDNAME) {
                            src = `https://res.cloudinary.com/${window.__IMG_CLDNAME}/image/upload/${item.image_id}`;
                        }
                        return `
                        <div class="item-card">
                            <img src="${src}" alt="${(item.title || 'Uploaded image')}" class="item-image">
                            <div class="item-title">${item.title ? item.title : 'Untitled'}</div>
                            <div class="item-actions">
                                <button type="button" class="delete-btn" onclick="deleteItem(${item.id})">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    `}).join('');
                }
                document.getElementById('imagesAlert').innerHTML = '';
            } catch (err) {
                const container = document.getElementById('itemsContainer');
                const errorMsg = err.name === 'AbortError' ? 'Request timed out' : 'Failed to load images';
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>${errorMsg}</p></div>`;
                showAlert('imagesAlert', errorMsg, 'error');
            }
        }

        // Delete item
        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            try {
                const response = await fetch(`/api/items/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('imagesAlert', 'Image deleted successfully', 'success');
                    const serviceId = document.getElementById('serviceSelect').value;
                    loadItemsForService(serviceId);
                } else {
                    showAlert('imagesAlert', data.error || 'Failed to delete image', 'error');
                }
            } catch (err) {
                showAlert('imagesAlert', 'Error deleting image', 'error');
            }
        }

        // Show alert
        function showAlert(elementId, message, type) {
            const alertDiv = document.getElementById(elementId);
            alertDiv.innerHTML = `
                <div class="alert ${type}">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        // Initialize on page load
        initializePage();
    </script>
</body>
</html>
