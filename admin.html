<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | ArtNest Decors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="max-width:800px;margin:80px auto;text-align:center;">
        <h1 id="statusHeading">Checking session...</h1>
        <p id="statusMessage" style="color:var(--muted);"></p>
        <div style="margin-top:20px;">
            <button id="logoutBtn" class="cta-submit-btn" style="display:none;">Logout</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Ensure only authenticated users see this page
        (function() {
            const token = localStorage.getItem('artnest_token');
            const user = localStorage.getItem('artnest_user') || 'admin';

            const heading = document.getElementById('statusHeading');
            const msg = document.getElementById('statusMessage');
            const logoutBtn = document.getElementById('logoutBtn');

            if (!token) {
                // not authenticated, redirect to login
                window.location.href = 'login.html';
                return;
            }

            heading.textContent = 'Success — Admin Login';
            msg.textContent = `Welcome back, ${user}. Server page returns: success admin login.`;

            logoutBtn.style.display = 'inline-block';
            logoutBtn.addEventListener('click', () => {
                logoutSession();
            });
        })();
    </script>
</body>
</html>
